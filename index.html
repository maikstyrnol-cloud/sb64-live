
<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SB64 Forest Observer — Live</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --fsc: #1b4332; --fsc-mid: #2d6a4f; --fsc-light: #40916c; --fsc-pale: #d8f3dc;
  --gold: #c8961c;
  --bg: #f4f4f2; --surface: #fff; --border: #e4e4df; --border-mid: #d0d0c8;
  --text: #1a1a18; --text-mid: #4a4a46; --text-light: #8a8a84;
  --blue: #1d4ed8; --purple: #6d28d9; --teal: #065f46; --amber: #92400e;
  --blue-bg: #eff6ff; --blue-br: #bfdbfe;
  --purple-bg: #f5f3ff; --purple-br: #ddd6fe;
  --teal-bg: #ecfdf5; --teal-br: #a7f3d0;
  --amber-bg: #fffbeb; --amber-br: #fde68a;
  --red-bg: #fef2f2; --red-br: #fecaca; --red: #dc2626;
  --r: 6px;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: inherit; }
button { font-family: inherit; cursor: pointer; }

/* ── HEADER ── */
.hdr { background: var(--fsc); position: sticky; top: 0; z-index: 300; box-shadow: 0 2px 8px rgba(0,0,0,0.22); }
.hdr-top { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
.logo { flex-shrink: 0; width: 38px; height: 38px; background: #fff; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.logo-main { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 0.95rem; color: var(--fsc); line-height: 1; }
.logo-sub { font-size: 0.38rem; letter-spacing: 0.14em; font-weight: 600; color: var(--fsc-mid); margin-top: 1px; }
.hdr-titles { flex: 1; }
.hdr-title { font-family: 'Playfair Display', serif; font-size: 1.08rem; font-weight: 700; color: #fff; line-height: 1.1; }
.hdr-sub { font-family: 'IBM Plex Mono', monospace; font-size: 0.56rem; color: rgba(255,255,255,0.45); letter-spacing: 0.1em; margin-top: 0.15rem; text-transform: uppercase; }
.hdr-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
.pulse { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; display: inline-block; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.45;transform:scale(0.62)} }
.live-dot { display: flex; align-items: center; gap: 0.3rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 0.22rem 0.5rem; border-radius: 2px; }
.fetch-status { font-family: 'IBM Plex Mono', monospace; font-size: 0.56rem; color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.12); padding: 0.22rem 0.5rem; border-radius: 2px; white-space: nowrap; }
.fetch-status.ok  { color: #4ade80; border-color: rgba(74,222,128,0.3); }
.fetch-status.err { color: #f87171; border-color: rgba(248,113,113,0.3); }

/* ── MAIN TABS (Schedule / Negotiations) ── */
.main-tabs { display: flex; padding: 0 2rem; }
.main-tab { padding: 0.5rem 0.9rem; font-size: 0.75rem; font-weight: 500; color: rgba(255,255,255,0.45); background: none; border: none; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; }
.main-tab:hover { color: rgba(255,255,255,0.8); }
.main-tab.active { color: #fff; border-bottom-color: #4ade80; }

/* ── DAY STRIP ── */
.day-strip-wrap { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 89px; z-index: 200; }
.day-strip { display: flex; align-items: stretch; overflow-x: auto; padding: 0 2rem; gap: 0; scrollbar-width: none; }
.day-strip::-webkit-scrollbar { display: none; }
.day-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1rem; padding: 0.5rem 0.9rem; border: none; background: none; border-bottom: 2px solid transparent; color: var(--text-light); transition: all 0.12s; white-space: nowrap; flex-shrink: 0; min-width: 62px; }
.day-btn:hover { color: var(--text); background: var(--bg); }
.day-btn.active { color: var(--fsc); border-bottom-color: var(--fsc); font-weight: 600; }
.day-btn.closed { opacity: 0.35; }
.day-btn .dn { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; line-height: 1; }
.day-btn .dw { font-size: 0.62rem; color: inherit; }
.day-btn .dpips { display: flex; gap: 2px; margin-top: 2px; justify-content: center; }
.pip { width: 5px; height: 5px; border-radius: 50%; }
.pip-n { background: var(--teal); }
.pip-s { background: var(--purple); }
.pip-o { background: var(--blue); }
.pip-star { background: var(--gold); }

/* filter chips — shown below day strip */
.filter-row { background: var(--bg); border-bottom: 1px solid var(--border); padding: 0.4rem 2rem; display: flex; align-items: center; gap: 0.35rem; position: sticky; top: 137px; z-index: 190; }
.chip { padding: 0.18rem 0.62rem; border-radius: 20px; border: 1px solid var(--border-mid); background: transparent; font-size: 0.7rem; font-weight: 500; color: var(--text-mid); transition: all 0.12s; white-space: nowrap; }
.chip:hover { border-color: var(--fsc-light); color: var(--fsc); }
.chip.active { background: var(--fsc); border-color: var(--fsc); color: #fff; }
.fr-spacer { flex: 1; }
.fr-ts { font-family: 'IBM Plex Mono', monospace; font-size: 0.59rem; color: var(--text-light); }

/* ── PAGE CONTENT ── */
.page { max-width: 900px; margin: 0 auto; padding: 1.75rem 2rem 3rem; }
.view { display: none; }
.view.active { display: block; }

/* ── DAY HEADER ── */
.day-hd { margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
.day-hd h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; line-height: 1; }
.day-hd-sub { font-size: 0.76rem; color: var(--text-light); }
.badge-pill { font-size: 0.62rem; font-weight: 600; padding: 0.17rem 0.52rem; border-radius: 3px; background: var(--fsc-pale); color: var(--fsc); border: 1px solid #b7e4c7; margin-left: auto; }

/* ── INFO BAR ── */
.ibar { border-radius: var(--r); padding: 0.55rem 0.85rem; font-size: 0.75rem; margin-bottom: 0.85rem; line-height: 1.45; display: flex; align-items: flex-start; gap: 0.5rem; }
.ibar a { text-decoration: underline; }
.ibar.blue { background: var(--blue-bg); border: 1px solid var(--blue-br); color: #1e40af; }
.ibar.green { background: var(--fsc-pale); border: 1px solid #b7e4c7; color: var(--fsc); }
.ibar.teal { background: var(--teal-bg); border: 1px solid var(--teal-br); color: #064e3b; }
.ibar.red { background: var(--red-bg); border: 1px solid var(--red-br); color: var(--red); }

/* ── SECTION HEAD ── */
.sh { font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-light); margin: 1.25rem 0 0.55rem; display: flex; align-items: center; gap: 0.5rem; }
.sh::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── CARDS ── */
.cards { display: flex; flex-direction: column; gap: 0.4rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid transparent; border-radius: var(--r); padding: 0.72rem 1rem; cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s; }
.card:hover { border-color: var(--border-mid); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.card.t-online  { border-left-color: var(--blue); }
.card.t-side    { border-left-color: var(--purple); }
.card.t-nego    { border-left-color: var(--teal); }
.card.t-mandate { border-left-color: var(--gold); }
.card.star      { border-left-color: var(--gold); }
.card.live-new  { border-color: #4ade80; box-shadow: 0 0 0 2px rgba(74,222,128,0.15); }

.cmeta { display: flex; align-items: center; gap: 0.38rem; margin-bottom: 0.26rem; flex-wrap: wrap; }
.ctime { font-family: 'IBM Plex Mono', monospace; font-size: 0.63rem; color: var(--text-light); background: var(--bg); padding: 0.06rem 0.36rem; border-radius: 3px; white-space: nowrap; }
.ctag { font-size: 0.59rem; font-weight: 600; padding: 0.08rem 0.42rem; border-radius: 20px; white-space: nowrap; }
.ct-online  { background: var(--blue-bg);   color: var(--blue);   border: 1px solid var(--blue-br); }
.ct-side    { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-br); }
.ct-nego    { background: var(--teal-bg);   color: var(--teal);   border: 1px solid var(--teal-br); }
.ct-mandate { background: var(--amber-bg);  color: var(--amber);  border: 1px solid var(--amber-br); }
.ct-star    { background: #fef9c3; color: #92400e; border: 1px solid #fde68a; }
.ct-live    { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
.ct-new     { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
.croom { font-size: 0.62rem; color: var(--text-light); margin-left: auto; font-family: 'IBM Plex Mono', monospace; }

.ctitle { font-size: 0.86rem; font-weight: 500; color: var(--text); line-height: 1.32; }
.card.star .ctitle { font-weight: 600; }

.cbody { font-size: 0.76rem; color: var(--text-mid); line-height: 1.55; margin-top: 0.38rem; display: none; }
.card.open .cbody { display: block; }
.corgs { font-size: 0.67rem; color: var(--text-light); margin-top: 0.28rem; font-style: italic; }
/* Live negotiations */
.nego-live-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--teal); border-radius: var(--r); padding: 0.65rem 0.95rem; margin-bottom: 0.38rem; }
.nego-live-card.forest { border-left-color: var(--gold); box-shadow: 0 0 0 1px rgba(200,150,28,0.15); }
.nego-live-card.new { border-color: #4ade80; }
.nego-fetch-btn { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--fsc); color: #fff; border: none; border-radius: 4px; padding: 0.35rem 0.8rem; font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: background 0.12s; }
.nego-fetch-btn:hover { background: var(--fsc-mid); }
.nego-fetch-btn:disabled { background: var(--text-light); cursor: default; }

.wcbtn { display: inline-flex; align-items: center; gap: 0.25rem; margin-top: 0.42rem; font-size: 0.68rem; font-weight: 500; color: var(--blue); text-decoration: none; border: 1px solid var(--blue-br); background: var(--blue-bg); padding: 0.18rem 0.52rem; border-radius: 4px; transition: background 0.12s; }
.wcbtn:hover { background: #dbeafe; }


/* ── ROUNDUP TABLE ── */
.rtbl { width: 100%; border-collapse: collapse; margin-bottom: 1.25rem; }
.rtbl th { font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-light); text-align: left; padding: 0.36rem 0.75rem; border-bottom: 2px solid var(--border); background: var(--bg); }
.rtbl td { font-size: 0.79rem; padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text-mid); line-height: 1.45; }
.rtbl tr:hover td { background: #fafaf8; }
.rtbl td:first-child { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--text-light); white-space: nowrap; font-weight: 500; width: 70px; }
.rtbl td strong { color: var(--text); font-weight: 600; }
.hot { color: var(--fsc); font-weight: 600; }

/* ── NEGOTIATIONS VIEW ── */
.nego-intro { background: var(--teal-bg); border: 1px solid var(--teal-br); border-radius: var(--r); padding: 0.7rem 0.95rem; font-size: 0.77rem; color: #064e3b; margin-bottom: 1.1rem; line-height: 1.55; }
.nego-intro a { color: var(--fsc); font-weight: 500; }

.live-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 1.4rem; }
.lph { background: var(--fsc); display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 1rem; flex-wrap: wrap; }
.lph h3 { font-size: 0.73rem; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 0.35rem; font-family: 'IBM Plex Mono', monospace; }
.dnav { display: flex; align-items: center; gap: 0.3rem; margin-left: auto; }
.narr { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); color: #fff; padding: 0.17rem 0.48rem; border-radius: 3px; font-size: 0.72rem; transition: background 0.12s; }
.narr:hover { background: rgba(255,255,255,0.22); }
.ndlbl { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: rgba(255,255,255,0.9); min-width: 108px; text-align: center; }
.rlbtn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.75); padding: 0.17rem 0.58rem; border-radius: 3px; font-size: 0.67rem; font-family: 'IBM Plex Mono', monospace; transition: background 0.12s; }
.rlbtn:hover { background: rgba(255,255,255,0.18); }
.lbody { padding: 1.25rem 1.5rem; background: #f0fdf4; display: flex; flex-direction: column; align-items: center; gap: 0.65rem; text-align: center; }
.lbody p { font-size: 0.77rem; color: var(--text-mid); max-width: 380px; line-height: 1.5; }
.obtn { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--fsc); color: #fff; padding: 0.5rem 1.1rem; border-radius: 4px; text-decoration: none; font-size: 0.77rem; font-weight: 600; transition: background 0.12s; }
.obtn:hover { background: var(--fsc-mid); }
.lhint { font-size: 0.63rem; color: var(--text-light); font-family: 'IBM Plex Mono', monospace; }

.nwlbl { font-family: 'IBM Plex Mono', monospace; font-size: 0.57rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fsc); background: var(--fsc-pale); border-left: 3px solid var(--fsc); padding: 0.27rem 0.7rem; border-radius: 0 3px 3px 0; display: inline-block; margin: 1rem 0 0.45rem; }
.ntbl { width: 100%; border-collapse: collapse; }
.ntbl th { font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-light); text-align: left; padding: 0.36rem 0.75rem; border-bottom: 2px solid var(--border); background: var(--bg); }
.nrow { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
.nrow:hover td { background: #f7fff9; }
.nrow.fr td:first-child { border-left: 3px solid var(--fsc-light); }
.nrow td { padding: 0.55rem 0.75rem; vertical-align: top; }
.nday { font-family: 'IBM Plex Mono', monospace; font-size: 0.67rem; color: var(--text-light); white-space: nowrap; }
.ntitle { font-size: 0.81rem; font-weight: 500; color: var(--text); }
.nbodylbl { font-size: 0.64rem; color: var(--text-light); margin-top: 0.1rem; font-family: 'IBM Plex Mono', monospace; }
.nnote { font-size: 0.73rem; color: var(--text-mid); margin-top: 0.32rem; line-height: 1.5; display: none; }
.nrow.open .nnote { display: block; }
.nbadges { display: flex; gap: 0.22rem; flex-wrap: wrap; padding-top: 0.08rem; }
.nb { font-size: 0.56rem; font-weight: 600; padding: 0.08rem 0.34rem; border-radius: 10px; white-space: nowrap; }
.nb-f { background: var(--teal-bg);   color: var(--teal);   border: 1px solid var(--teal-br); }
.nb-n { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-br); }
.nb-r { background: var(--amber-bg);  color: var(--amber);  border: 1px solid var(--amber-br); }
.nb-w { background: var(--blue-bg);   color: var(--blue);   border: 1px solid var(--blue-br); }
.nb-b { background: var(--fsc-pale);  color: var(--fsc);    border: 1px solid #b7e4c7; }

/* ── FOOTER ── */
.footer { background: var(--surface); border-top: 1px solid var(--border); padding: 0.7rem 2rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.fl { font-size: 0.7rem; color: var(--text-mid); text-decoration: none; border-bottom: 1px solid transparent; transition: all 0.1s; }
.fl:hover { color: var(--fsc); border-bottom-color: var(--fsc); }
.flsep { color: var(--border-mid); }
.fver { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; color: var(--text-light); }

.closed-msg { padding: 4rem 0; text-align: center; color: var(--text-light); font-family: 'Playfair Display', serif; font-style: italic; font-size: 1rem; }

.spinner { width: 11px; height: 11px; border: 2px solid var(--teal-br); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 10px; }

@media (max-width: 640px) {
  .hdr-top { padding: 0.65rem 1rem; }
  .page { padding: 1.25rem 1rem 3rem; }
  .day-strip { padding: 0 1rem; }
  .filter-row { padding: 0.35rem 1rem; }
  .footer { padding: 0.65rem 1rem; }
  .hdr-right .fetch-status { display: none; }
  .day-strip-wrap { top: 82px; }
  .filter-row { top: 130px; }
}
</style>
</head>

// BUILD DAY STRIP
// ════════════════════════════════════════════════
function buildDayStrip() {
  const strip = document.getElementById('dayStrip');
  DAYS.forEach(d => {
    const evs = E[d.id] || [];
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (d.closed ? ' closed' : '') + (d.id === activeDay ? ' active' : '');
    btn.id = 'daybtn-' + d.id;
    btn.onclick = () => showDay(d.id);

    const pips = [];
    if (evs.some(e => e.type === 'nego'))   pips.push('<span class="pip pip-n" title="Negotiation"></span>');
    if (evs.some(e => e.type === 'side' || e.type === 'mandate')) pips.push('<span class="pip pip-s" title="Side event"></span>');
    if (evs.some(e => e.type === 'online')) pips.push('<span class="pip pip-o" title="Webcast"></span>');
    if (evs.some(e => e.star))              pips.push('<span class="pip pip-star" title="Forest priority"></span>');

    btn.innerHTML = `<span class="dn">${d.n}</span><span class="dw">${d.wd}</span><div class="dpips">${pips.join('')}</div>`;
    strip.appendChild(btn);
  });
}

    <table class="rtbl">

  page.appendChild(rv);

  // ── Day views ──

      const otherEvs = evs.filter(e => e.type !== 'nego');

  page.appendChild(nv);

  // Fill nego tables
  [[NW1,'ntb1'],[NW2,'ntb2']].forEach(([rows, tid]) => {

      const tr = document.createElement('tr');
      tr.className = 'nrow' + (r.forest ? ' fr' : '');

function isForest(t, d) {
  const txt = ((t||'') + ' ' + (d||'')).toLowerCase();
  return FOREST_KW.some(k => txt.includes(k));
}

async function fetchLive() {
  const st = document.getElementById('fetchStatus');
  try {
    st.textContent = 'Fetching…'; st.className = 'fetch-status';
    const res = await fetch('/api/schedule?source=sideevents');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const all = data.events || [];
    const newForest = [];

    all.forEach(ev => {
      if (!ev.title) return;
      if (isForest(ev.title, ev.desc) && !seenTitles.has(ev.title)) {
        seenTitles.add(ev.title);
        newForest.push(ev);
      }
    });

    liveEvents = all.filter(ev => isForest(ev.title, ev.desc));
    updateLiveBanner(newForest, all.length);
    injectLiveCards();

    st.textContent = '✓ Updated ' + new Date().toLocaleTimeString('en-DE',{hour:'2-digit',minute:'2-digit'});
    st.className = 'fetch-status ok';
    tickTs();

  } catch(err) {
    const st = document.getElementById('fetchStatus');
    st.textContent = '⚠ Fetch failed'; st.className = 'fetch-status err';
    const lb = document.getElementById('live-banner');
    if (lb) { lb.className = 'ibar red'; lb.innerHTML = `⚠ Could not reach SEORS (${err.message}). Pre-loaded data shown. Retrying in 3 min.`; }
  }
}

function updateLiveBanner(newF, total) {
  const lb = document.getElementById('live-banner');
  if (!lb) return;
  if (newF.length > 0) {
    lb.className = 'ibar teal';
    lb.innerHTML = `🆕 <strong>${newF.length} new forest-relevant side event${newF.length > 1 ? 's' : ''} detected.</strong> Check the relevant day tab. Total SEORS events: ${total}.`;
  } else {
    lb.className = 'ibar teal';
    lb.innerHTML = `<span class="pulse" style="background:var(--fsc-light)"></span>&nbsp; Live data loaded — ${total} total SEORS events, ${liveEvents.length} forest-relevant. No new additions since last check.`;
  }
}

function injectLiveCards() {
  DAYS.forEach(d => {
    const slot = document.getElementById('live-slot-' + d.id);
    if (!slot) return;
    const matched = liveEvents.filter(ev => {
      if (!ev.date) return false;
      const s = ev.date + '';
      return s.includes(String(d.n) + ' Jun') || s.includes(' ' + d.n + ' ');
    });
    if (!matched.length) { slot.innerHTML = ''; return; }

    const cards = matched.map(ev => {
      const isNew = !Array.from(seenTitles).slice(0, -matched.length).includes(ev.title);
      return `<div class="card t-side live-new" onclick="this.classList.toggle('open')">
        <div class="cmeta">
          ${ev.time ? `<span class="ctime">${ev.time}</span>` : ''}
          <span class="ctag ct-live">🔴 LIVE from SEORS</span>
          ${isNew ? '<span class="ctag ct-new">🆕 New</span>' : ''}
          ${ev.room ? `<span class="croom">${ev.room}</span>` : ''}
        </div>
        <div class="ctitle">${ev.title}</div>
        ${ev.desc ? `<div class="cbody">${ev.desc}</div>` : ''}
      </div>`;
    }).join('');

    slot.innerHTML = `<div class="sh">Live — forest-relevant additions from SEORS</div><div class="cards">${cards}</div>`;
  });
}

// ════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════
function showDay(id) {
  activeDay = id;
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('daybtn-' + id);
  if (btn) { btn.classList.add('active'); btn.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'}); }
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const dv = document.getElementById('view-' + id);
  if (dv) dv.classList.add('active');
  applyFilter();
  // Fetch live negotiations for this day if not already cached
  const d = DAYS.find(d => d.id === id);
  if (d && !d.closed) {
    const date = '2026-06-' + String(d.n).padStart(2, '0');
    if (!negoCache[date]) fetchNegotiations(id);
  }
}

function switchMain(m) {
  activeMain = m;
  document.getElementById('tab-sched').classList.toggle('active', m === 'sched');
  document.getElementById('tab-nego').classList.toggle('active', m === 'nego');

  const dayStripWrap = document.getElementById('dayStripWrap');
  const filterRow = document.getElementById('filterRow');
  dayStripWrap.style.display = m === 'sched' ? '' : 'none';
  filterRow.style.display    = m === 'sched' ? '' : 'none';

  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  if (m === 'sched') {
    const dv = document.getElementById('view-' + activeDay);
    if (dv) dv.classList.add('active');
  } else {
    document.getElementById('view-nego').classList.add('active');
  }
}

function filterCards(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  if (btn) btn.classList.add('active');
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll('.card').forEach(c => {
    const t = c.dataset.type, s = c.dataset.star === '1';
    let show = true;
    if      (activeFilter === 'online') show = (t === 'online' || t === 'mandate');
    else if (activeFilter === 'side')   show = (t === 'side'   || t === 'mandate');
    else if (activeFilter === 'nego')   show = (t === 'nego');
    else if (activeFilter === 'star')   show = s;
    c.style.display = show ? '' : 'none';
  });
}

function updateNL() {
  const date = CONF_DATES[ndIdx] || CONF_DATES[0];
  const link = document.getElementById('negoLink');
  if (link) link.href = `https://unfccc.int/sb64/schedule?date=${date}&type=Negotiations`;
  const lbl = document.getElementById('ndLbl');
  if (lbl) lbl.textContent = new Date(date + 'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function prevND() { if (ndIdx > 0) { ndIdx--; updateNL(); } }
function nextND() { if (ndIdx < CONF_DATES.length - 1) { ndIdx++; updateNL(); } }

let negoCache = {};

function negoCard(s, forest) {
  var card = document.createElement('div');
  card.className = 'nego-live-card' + (forest ? ' forest' : '');
  var meta = '<div class="cmeta">' +
    '<span class="ctime">' + (s.time||'') + '</span>' +
    '<span class="ctag ct-nego">Negotiation</span>' +
    (s.isOpen ? '<span class="ctag ct-online">Open</span>' : '') +
    (s.room ? '<span class="croom">' + s.room + '</span>' : '') +
    '</div>';
  var title = '<div class="ctitle">' + (s.title||'') + '</div>';
  card.innerHTML = meta + title;
  return card.outerHTML;
}

async function fetchNegotiations(dayId) {
  var d = DAYS.find(function(d){ return d.id === dayId; });
  if (!d || d.closed) return;
  var date = '2026-06-' + String(d.n).padStart(2, '0');
  var slot = document.getElementById('nego-live-' + dayId);
  if (!slot) return;

  var shDiv = '<div class="sh">Live negotiations</div>';
  slot.innerHTML = shDiv + '<div class="ibar teal"><span class="spinner"></span> Fetching from UNFCCC...</div>';

  try {
    var res = await fetch('/api/schedule?source=negotiations&date=' + date);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    if (data.error) throw new Error(data.error);

    var sessions = data.sessions || [];
    negoCache[date] = sessions;

    if (sessions.length === 0) {
      slot.innerHTML = shDiv + '<div class="ibar teal">No sessions confirmed yet for this day. UNFCCC adds them throughout the day.</div>';
      return;
    }

    var forestSessions = sessions.filter(function(s){ return s.isForest; });
    var otherSessions  = sessions.filter(function(s){ return !s.isForest; });

    var html = shDiv;

    if (forestSessions.length) {
      html += '<div style="margin-bottom:0.4rem;font-family:monospace;font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold)">⭐ Forest / NbS relevant</div>';
      forestSessions.forEach(function(s){ html += negoCard(s, true); });
    }

    if (otherSessions.length) {
      html += '<div style="margin:0.7rem 0 0.4rem;font-family:monospace;font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-light)">Other sessions</div>';
      otherSessions.forEach(function(s){ html += negoCard(s, false); });
    }

    var ft = new Date(data.fetchedAt).toLocaleTimeString('en-DE',{hour:'2-digit',minute:'2-digit'});
    var refreshBtn = document.createElement('button');
    refreshBtn.className = 'nego-fetch-btn';
    refreshBtn.style = 'font-size:0.63rem;padding:0.15rem 0.5rem;';
    refreshBtn.textContent = '↻ Refresh';
    refreshBtn.setAttribute('data-day', dayId);
    refreshBtn.setAttribute('data-date', date);
    refreshBtn.onclick = function() {
      negoCache[this.getAttribute('data-date')] = null;
      fetchNegotiations(this.getAttribute('data-day'));
    };

    slot.innerHTML = html;
    var footer = document.createElement('p');
    footer.style = 'font-size:0.63rem;color:var(--text-light);margin-top:0.7rem;font-family:IBM Plex Mono,monospace;';
    footer.innerHTML = 'Last fetched: ' + ft + ' CET &nbsp;·&nbsp; ';
    footer.appendChild(refreshBtn);
    footer.innerHTML += ' &nbsp;·&nbsp; <a href="https://unfccc.int/sb64/schedule?date=' + date + '" target="_blank" style="color:var(--text-light)">Open on UNFCCC ↗</a>';
    slot.appendChild(footer);

  } catch(err) {
    var retryBtn = document.createElement('button');
    retryBtn.className = 'nego-fetch-btn';
    retryBtn.style = 'margin-left:0.5rem';
    retryBtn.textContent = 'Retry';
    retryBtn.onclick = function(){ fetchNegotiations(dayId); };
    slot.innerHTML = shDiv + '<div class="ibar red">⚠ Could not fetch (' + err.message + '). <a href="https://unfccc.int/sb64/schedule?date=' + date + '" target="_blank" style="text-decoration:underline">Open UNFCCC ↗</a></div>';
    slot.querySelector('.ibar').appendChild(retryBtn);
  }
}

function tickTs() {
  const s = new Date().toLocaleTimeString('en-DE',{hour:'2-digit',minute:'2-digit'}) + ' CET';
  const ft = document.getElementById('frTs'); if (ft) ft.textContent = 'Refreshed ' + s;
  const fv = document.getElementById('fver'); if (fv) fv.textContent = 'SB64 · Bonn 2026 · ' + s;
}

// ════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════
buildDayStrip();
buildContent();

// Auto-jump to today if within conference
const todayStr = new Date().toISOString().slice(0,10);
const DM = {'2026-06-08':'d08','2026-06-09':'d09','2026-06-10':'d10','2026-06-11':'d11',
            '2026-06-12':'d12','2026-06-13':'d13','2026-06-14':'d14','2026-06-15':'d15',
            '2026-06-16':'d16','2026-06-17':'d17','2026-06-18':'d18'};
// If today is a conference day, show it. Otherwise show the first upcoming day (or d08 before conf starts).
if (DM[todayStr]) {
  showDay(DM[todayStr]);
} else {
  // Find the next upcoming conference day, or fall back to d08
  const upcoming = CONF_DATES.find(d => d >= todayStr);
  const fallback = upcoming ? DM[upcoming] : 'd08';
  showDay(fallback || 'd08');
}

tickTs();
fetchLive();
setInterval(fetchLive, 3 * 60 * 1000);
// Auto-refresh negotiations for active day every 5 minutes
setInterval(() => {
  if (activeDay) {
    const d = DAYS.find(d => d.id === activeDay);
    if (d && !d.closed) {
      const date = '2026-06-' + String(d.n).padStart(2, '0');
      negoCache[date] = null; // clear cache to force refresh
      fetchNegotiations(activeDay);
    }
  }
}, 5 * 60 * 1000);
</script>
